# Mirrors the 15 production CronJobs in fantasy-infra (base/core-pipeline, base/browser-worker):
# same commands, schedules, deadlines and resources. weekly-ingestor's initContainer split becomes
# the sync-league -> metrics-extractor chain steps; the reconcile and prescan CronJobs become
# second schedules on their jobs; the Tuesday clock offsets become the tuesday-weekly chain.
# Profile secrets/volumes name src/launcher/k8s.py's BUNDLES/VOLUMES. A profile covers every
# CronJob it replaces, so some jobs get env they don't read; core-ops adds the broker URL and the
# fantasy-core-pipeline service account for the injury syncer. The draft jobs are services the
# draft endpoints start and cancel (src/services/draft_run_service.py); they have no schedule.
version: 1
global:
  max_concurrent_pods: 2
  max_deadline: 2h
  max_service_deadline: 8h
  start_timeout: 10m
  manual_queue_ttl: 30m
seasons:
  regular: {start: 1, end: 18}
profiles:
  core: {image: CORE_IMAGE, secrets: [db, espn, redis, trigger-api, league-config]}
  core-ops: {image: CORE_IMAGE, serviceAccount: fantasy-core-pipeline, secrets: [db, espn, redis, trigger-api, league-config, amqp]}
  worker: {image: WORKER_IMAGE, serviceAccount: fantasy-browser-worker, secrets: [db, espn, llm, notify, league-config], volumes: [espn-session-state]}
  # The draft room connector: ESPN cookies, the league ids and Redis, as its pods had before.
  worker-draft: {image: WORKER_IMAGE, secrets: [espn, redis, league-config]}
# trade-scan and trade-inbox drive the one stored ESPN browser session.
groups:
  espn-session: {limit: 1}
defaults:
  executor: pod
  overlap: forbid
  max_attempts: 1
  deadline: 1h
  alert: warning
  resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
jobs:
  sync-league:
    profile: core
    command: [python, -m, src.ingestion.sync_league, --season, $(CURRENT_YEAR)]
    max_attempts: 2
  metrics-extractor:
    profile: core
    command: [python, -m, src.ingestion.metrics_extractor]
    max_attempts: 2
  sync-actual-scores:
    profile: core
    command: [python, -m, src.ingestion.sync_actual_scores, --season, $(CURRENT_YEAR)]
    deadline: 30m
    max_attempts: 2
    schedules:
      - {cron: '0 10 * * 5', tz: America/Chicago, catch_up: 2h}
  projections-refresh:
    profile: core
    command: [python, -m, src.jobs.draft_prep_refresh]
    params: {week_offset: 'int?'}
    fan_out: {param: week_offset, values: [0, 1, 2, 3]}
    schedules:
      - {cron: '0 18 * * *', tz: America/Chicago, catch_up: 1h}
  lineup-optimizer:
    profile: core
    command: [python, -m, src.optimization.lineup_solver]
    params: {week: 'int?', dry_run: 'bool?'}
    max_attempts: 3
    alert: critical
    acts: true
  waiver-trigger:
    profile: core
    command: [python, -m, src.optimization.waiver_evaluator]
    params: {week: 'int?'}
    max_attempts: 3
    alert: critical
    acts: true
  rumor-action-trigger:
    profile: core
    command: [python, -m, src.services.rumor_action_service, --team-id, $(ESPN_TEAM_ID), --season, $(CURRENT_YEAR)]
    max_attempts: 3
    acts: true
    schedules:
      - {cron: '45 21 * * *', tz: America/Chicago, catch_up: 1h}
    on_event:
      - {key: rumor.signal_created, debounce: 30m}
  rumor-syncer:
    profile: core
    command: [python, -m, src.ingestion.sync_rumors]
    deadline: 25m
    max_attempts: 2
    schedules:
      - {cron: '*/30 * * * *', tz: America/Chicago, catch_up: 0}
  rapid-status-syncer:
    profile: core-ops
    command: [python, -m, src.ingestion.sync_players]
    deadline: 9m
    max_attempts: 2
    schedules:
      - {cron: '*/10 * * * 4,0,1', tz: America/Chicago, catch_up: 0}
  # Draft-day services. A practice run is retired once its connector's heartbeat lapses.
  draft-listener:
    class: service
    profile: core
    command: [python, -m, src.optimization.draft_matrix]
    params: &listener-params {league_id: str, team_id: str, season: int, week: 'int?', mode: str, pick_clock_seconds: int, auto_draft_delay_seconds: int}
    param_env: &listener-env {mode: DRAFT_MODE, pick_clock_seconds: DRAFT_PICK_CLOCK_SECONDS, auto_draft_delay_seconds: AUTO_DRAFT_DELAY_SECONDS}
    deadline: 6h
    alert: critical
    resources: &listener-resources {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 1000m, memory: 1Gi}}
  practice-draft-listener:
    class: service
    profile: core
    command: [python, -m, src.optimization.draft_matrix]
    params: *listener-params
    param_env: *listener-env
    deadline: 3h
    alert: none
    resources: *listener-resources
    health: &practice-health {key: 'draft:{league_id}:health', grace: 10m}
  draft-connector:
    class: service
    profile: worker-draft
    command: [node, src/bots/draft_sync.js]
    # league_id is only for lookups: a live connector takes its league from ESPN_LEAGUE_ID.
    params: {league_id: str}
    param_env: {league_id: DRAFT_LEAGUE_ID}
    deadline: 6h
    alert: critical
    resources: &connector-resources {requests: {cpu: 200m, memory: 512Mi}, limits: {cpu: 1000m, memory: 1200Mi}}
  practice-draft-connector:
    class: service
    profile: worker-draft
    command: [node, src/bots/draft_sync.js]
    params: {room_url: str, league_id: 'str?'}
    # league_id is only for the health key and lookups; draft_sync.js learns it from the room.
    param_env: {room_url: DRAFT_ROOM_URL, league_id: DRAFT_LEAGUE_ID}
    deadline: 3h
    alert: none
    resources: *connector-resources
    health: *practice-health
  trade-candidates:
    profile: core
    command: [python, -m, src.jobs.trade_candidates]
    deadline: 25m
    schedules:
      - {cron: '0 7 * * *', tz: America/Chicago, catch_up: 2m}
      - {cron: '30 12 * * 3,5', tz: America/Chicago, catch_up: 2m}
  espn-session-healthcheck:
    profile: worker
    command: [node, src/bots/check_espn_session.js]
    max_attempts: 2
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 1000m, memory: 1200Mi}}
    schedules:
      - {cron: '0 6 * * 1', tz: UTC, catch_up: 2h}
  rumor-digest-bot:
    profile: worker
    command: [node, src/bots/rumor_digest_bot.js]
    max_attempts: 2
    resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
    schedules:
      - {cron: '0 11 * * *', tz: America/Chicago, catch_up: 2h}
  trade-inbox:
    profile: worker
    group: espn-session
    command: [node, src/bots/trade_inbox.js, --refresh]
    deadline: 11m
    resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {cpu: 1000m, memory: 1200Mi}}
    schedules:
      - {cron: '0 8-22/2 * * *', tz: America/Chicago, catch_up: 30m}
  trade-scan:
    profile: worker
    group: espn-session
    command: [node, src/bots/trade_scan.js, --stage]
    deadline: 16m
    resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {cpu: 1000m, memory: 1200Mi}}
    schedules:
      - {cron: '0 13 * * 3,5', tz: America/Chicago, catch_up: 30m}
chains:
  tuesday-weekly:
    schedule: {cron: '0 16 * * 2', tz: America/Chicago, catch_up: 2h, seasons: [regular]}
    max_duration: 8h
    steps:
      sync-league: {}
      metrics-extractor: {after: [{step: sync-league, on: success}]}
      sync-actual-scores: {after: [{step: metrics-extractor, on: success}]}
      projections-refresh: {after: [{step: sync-actual-scores, on: finish}]}
      lineup-optimizer: {after: [{step: projections-refresh, on: finish}], latest: '19:15'}
      waiver-trigger: {after: [{step: lineup-optimizer, on: finish}], latest: '20:30'}
      rumor-action-trigger: {after: [{step: waiver-trigger, on: finish}], latest: '21:45'}
