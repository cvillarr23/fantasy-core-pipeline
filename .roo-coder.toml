# Project-level configuration for roo-coder (Token Guard) in this repo.
# Generated by the configure-docs skill.
#
# Deviations from the defaults (README*.md, CLAUDE.md, docs/**/*.md):
#
#   + .github/copilot-instructions.md -- project-specific AI-tool instructions,
#     same role as CLAUDE.md for a different assistant; worth indexing.
#
#   - **/.pytest_cache/** -- pytest's own generated cache-directory README,
#     not project documentation (it explains what the cache dir is, unrelated
#     to this project).
#   - .claude/** -- Claude Code session/resume state (.claude/RESUME.md),
#     not stable documentation meant to answer questions about the project.
#   - .remember/** -- dated personal task-tracking notes (now.md,
#     today-*.done.md, archive.md), session/journal content rather than
#     documentation about how the project works.

[docs]
include = [
    "README*.md",
    "CLAUDE.md",
    "docs/**/*.md",
    ".github/copilot-instructions.md",
]

exclude = [
    "**/node_modules/**",
    "**/.git/**",
    "**/.venv/**",
    "**/.pytest_cache/**",
    ".claude/**",
    ".remember/**",
]
