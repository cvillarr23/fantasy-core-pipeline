name: Notify docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the docs site
        uses: cvillarr23/fantasy-project/.github/actions/dispatch-docs@e140aa866f3e22453dbcae4e8471b3dbbe475605
        with:
          token: ${{ secrets.DOCS_SITE_DISPATCH_TOKEN }}
