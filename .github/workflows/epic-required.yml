name: Require epic assignment

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  check-epic:
    runs-on: fantasy-runners
    steps:
      - name: Check for a parent epic
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const result = await github.graphql(`
              query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  issue(number:$number) { parent { number title repository { name } } }
                }
              }
            `, { owner: context.repo.owner, repo: context.repo.repo, number: context.issue.number });

            const parent = result.repository.issue.parent;
            if (parent) return;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ["needs-epic"],
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "This issue isn't attached to a [fantasy-project epic](https://github.com/cvillarr23/fantasy-project/issues?q=is%3Aissue+is%3Aopen+label%3Aepic) yet. Every issue should end up as a sub-issue of exactly one epic (or `[EPIC] Miscellaneous` if it's genuinely too small for its own) — see `.wayfinder/tracker.md` in fantasy-project for how to wire that up. Remove the `needs-epic` label once it's assigned.",
            });
