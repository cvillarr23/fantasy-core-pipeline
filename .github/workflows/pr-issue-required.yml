name: Require linked issue

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  issues: write
  pull-requests: write

jobs:
  check-linked-issue:
    runs-on: fantasy-runners
    steps:
      - name: Check for a closing issue reference
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let result;
            try {
              result = await github.graphql(`
                query($owner:String!, $repo:String!, $number:Int!) {
                  repository(owner:$owner, name:$repo) {
                    pullRequest(number:$number) {
                      closingIssuesReferences(first: 10) { totalCount }
                    }
                  }
                }
              `, { owner: context.repo.owner, repo: context.repo.repo, number: context.issue.number });
            } catch (error) {
              core.setFailed("Unable to read closing issue references with this PR token. A maintainer must verify the closing issue link; fork and Dependabot PRs use read-only tokens. " + error.message);
              return;
            }

            // The repo-scoped token cannot see closing links to private sibling repos.
            // Accept a qualified reference to the shared tracker; maintainers verify its target.
            const body = context.payload.pull_request.body || "";
            const trackerReference = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+(?:https:\/\/github\.com\/cvillarr23\/fantasy-project\/issues\/|cvillarr23\/fantasy-project#)[1-9]\d*\b/i.test(body);
            const linked = result.repository.pullRequest.closingIssuesReferences.totalCount > 0 || trackerReference;
            const readOnly = context.payload.pull_request.head.repo.full_name !== context.payload.pull_request.base.repo.full_name || context.actor === "dependabot[bot]";
            if (readOnly) {
              if (!linked) {
                core.setFailed("PR has no linked closing issue. Add Fixes #N or Closes owner/repo#N to the PR description. Labels and comments are skipped because fork and Dependabot PRs use read-only tokens.");
              }
              return;
            }
            const labelName = "needs-issue-link";

            const { data: existingLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const hasLabel = existingLabels.some((l) => l.name === labelName);

            if (linked) {
              if (hasLabel) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: labelName,
                });
              }
              return;
            }

            if (!hasLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [labelName],
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: "This PR doesn't reference a closing issue yet. Add `Fixes #N` / `Closes #N` (or the cross-repo form, e.g. `Fixes cvillarr23/fantasy-project#N`) to the PR description so it links up in GitHub's tracker and shows up for PM-loop review. Remove the `needs-issue-link` label once it's linked.",
              });
            }

            core.setFailed("PR has no linked closing issue.");
