name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: activity-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The existing codebase predates this workflow and isn't black-clean yet, so this
      # reports formatting drift without blocking merges until a dedicated reformat pass.
      - name: black --check
        run: black --check .
        continue-on-error: true

      # Same rationale as black: several modules currently lack type stubs for
      # third-party deps (psycopg2, nflreadpy, pika), which mypy flags but shouldn't
      # block merges on its own.
      - name: mypy
        run: mypy src/
        continue-on-error: true

      - name: pytest
        env:
          DB_PASSWORD: test
          ACTIVITY_TEST_DSN: host=127.0.0.1 port=5432 dbname=postgres user=postgres password=activity-test
        run: pytest tests/ -v

  build-and-push:
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fantasy-core-pipeline
          tags: |
            type=raw,value=main
            type=raw,value=latest
            type=sha,format=long

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Report published image digest
        run: |
          echo "Published ghcr.io/${{ github.repository_owner }}/fantasy-core-pipeline digest:"
          echo "${{ steps.build.outputs.digest }}"
