name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The existing codebase predates this workflow and isn't black-clean yet, so this
      # reports formatting drift without blocking merges until a dedicated reformat pass.
      - name: black --check
        run: black --check .
        continue-on-error: true

      # Same rationale as black: several modules currently lack type stubs for
      # third-party deps (psycopg2, nflreadpy, pika), which mypy flags but shouldn't
      # block merges on its own.
      - name: mypy
        run: mypy src/
        continue-on-error: true

      - name: pytest
        env:
          DB_PASSWORD: test
        run: pytest tests/ -v

  build-and-push:
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fantasy-core-pipeline:latest
            ghcr.io/${{ github.repository_owner }}/fantasy-core-pipeline:${{ github.sha }}

      # ArgoCD (fantasy-infra Application, automated+selfHeal) only syncs on a real git diff -
      # deployment.yaml pinning :latest means a plain image push produces zero diff, so the
      # running pod never actually redeploys. Bumping the tag to this commit's SHA here gives
      # ArgoCD something to sync, which triggers a real rollout. INFRA_DEPLOY_KEY is a
      # write-enabled deploy key on fantasy-infra only - scoped to that one repo.
      - name: Set up deploy key for fantasy-infra
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.INFRA_DEPLOY_KEY }}

      - name: Bump fantasy-core-pipeline image tag in fantasy-infra
        env:
          GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=accept-new"
        run: |
          git clone git@github.com:cvillarr23/fantasy-infra.git fantasy-infra
          cd fantasy-infra
          grep -rl "ghcr.io/cvillarr23/fantasy-core-pipeline:" --include="*.yaml" . \
            | xargs sed -i "s|ghcr.io/cvillarr23/fantasy-core-pipeline:[A-Za-z0-9_.-]*|ghcr.io/cvillarr23/fantasy-core-pipeline:${GITHUB_SHA}|g"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No image-tag change to commit"
            exit 0
          fi
          git commit -am "Deploy fantasy-core-pipeline@${GITHUB_SHA:0:7}"
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin main
            git rebase origin/main
          done
          exit 1
